name: Build & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reimport:
        description: "Re-import products, images and policies from the live Shopify store"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import from Shopify (first run, or when requested)
        if: ${{ hashFiles('data/shopify_products.json') == '' || hashFiles('static/videos/hero.mp4') == '' || inputs.reimport }}
        run: |
          python tools/import_shopify.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data static
          git diff --cached --quiet || git commit -m "Import products, images and policies from Shopify"
          git push

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
